name: Build Signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias yogadolby \
            -storepass yogadolby83bu \
            -keypass yogadolby83bu \
            -dname "CN=YogaDolbyAtmos, OU=AudioDSP, O=YogaCustom, L=CN, S=CN, C=CN"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Signed Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare Dist Artifacts
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/release/app-release.apk output-apk/YogaDolbyAtmos-v1.1.1-LevelMatched-Release-Signed.apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/YogaDolbyAtmos-v1.1.1-LevelMatched-Debug.apk
          ls -lh output-apk/

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YogaDolbyAtmos-APK-v1.1.1
          path: output-apk/*.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.1 output-apk/*.apk \
            --title "杜比音效 · YOGA Pro 14s (83BU) 原厂音质 + 手机扬声器去齿音锁定版 v1.1.1" \
            --notes "100% 保留 v1.1.0 原厂全部调音与质感：后级自动拉平音量（+6dB减6dB / +4dB减4dB），内置「手机扬声器优化」开关（默认开启自动施加 4K/8K -3dB 去齿音并将 10 段均衡器置灰锁定防误触，插耳机自动直通），右上角 ⚙️ 支持隐藏后台卡片与通知栏。" \
            || gh release upload v1.1.1 output-apk/*.apk --clobber
