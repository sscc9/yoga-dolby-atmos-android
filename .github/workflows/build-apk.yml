name: Build Signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias yogadolby \
            -storepass yogadolby83bu \
            -keypass yogadolby83bu \
            -dname "CN=YogaDolbyAtmos, OU=AudioDSP, O=YogaCustom, L=CN, S=CN, C=CN"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Signed Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare Dist Artifacts
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/release/app-release.apk output-apk/YogaDolbyAtmos-v1.1.0-PC100-Release-Signed.apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/YogaDolbyAtmos-v1.1.0-PC100-Debug.apk
          ls -lh output-apk/

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YogaDolbyAtmos-APK-v1.1.0
          path: output-apk/*.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0 output-apk/*.apk \
            --title "杜比音效 · YOGA Pro 14s (83BU) 100%电脑原厂直通版 v1.1.0" \
            --notes "100% 无删改直通还原电脑 Atmos 3.7 (耳机) 与 ALC287 (扬声器) XML 全部频段、VolMax 增益、双段 MBC 与冲程限幅参数。" \
            || gh release upload v1.1.0 output-apk/*.apk --clobber
